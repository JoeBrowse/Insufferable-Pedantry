<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Insufferable Pedant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="masthead-bar">
          <span class="dateline" id="dateline"></span>
          <button class="text-btn" id="tour-btn" type="button">Tour</button>
        </div>
        <a class="wordmark" href="#home">Insufferable Pedant</a>
        <p class="tagline">Capital allowances, to the letter</p>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="dock" id="dock" aria-label="Sections">
      <div class="dock-inner">
        <a class="dock-card" href="#news" data-section="news">
          <span class="kicker">News</span>
          <span class="dock-title">What changed</span>
          <span class="dock-meta" data-meta="news"></span>
        </a>
        <a class="dock-card" href="#diagnosis" data-section="diagnosis">
          <span class="kicker">Diagnosis</span>
          <span class="dock-title">Name the relief</span>
          <span class="dock-meta" data-meta="diagnosis"></span>
        </a>
        <a class="dock-card" href="#learn" data-section="learn">
          <span class="kicker">Learn</span>
          <span class="dock-title">Lessons by topic</span>
          <span class="dock-meta" data-meta="learn"></span>
        </a>
      </div>
    </nav>

    <div id="overlay-root"></div>

    <script src="data/reliefs.js"></script>
    <script src="data/news.js"></script>
    <script src="data/diagnosis.js"></script>
    <script src="data/lessons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
